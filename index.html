:root{
  --bg:#050505;
  --surface:#111111;
  --surface2:#181818;
  --gold:#D4AF37;
  --gold2:#FFD700;
  --text:#fff;
  --muted:#b8b3a6;
  --line:#2b271d;
  --green:#34c77b;
  --red:#ff5d5d;
  --safe-area-inset-top: env(safe-area-inset-top, 0px)
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#050505;
    --surface:#111111;
    --text:#fff
  }
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Trebuchet MS",Verdana,sans-serif
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

a{
  color:inherit
}

.shell{
  min-height:100vh;
  background:var(--bg);
  padding-top:var(--safe-area-inset-top);
  position:relative;
  overflow-x:clip
}

.watermark{
  position:fixed;
  right:-70px;
  top:35%;
  width:430px;
  opacity:.055;
  pointer-events:none;
  z-index:0;
  filter:drop-shadow(0 0 20px #D4AF37)
}

.topbar{
  height:72px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 max(20px,calc((100vw - 1240px)/2));
  position:sticky;
  top:var(--safe-area-inset-top);
  z-index:20;
  background:rgba(5,5,5,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)
}

.topbar>img{
  height:46px;
  width:46px;
  -o-object-fit:contain;
     object-fit:contain
}

.topbar>div{
  display:flex;
  flex-direction:column;
  line-height:1
}

.topbar b{
  font-size:21px;
  letter-spacing:1px
}

.topbar span{
  font-size:10px;
  color:var(--gold);
  letter-spacing:2px
}

.live{
  margin-left:auto!important;
  color:#d8ffe9!important;
  border:1px solid #244a35;
  padding:7px 10px;
  border-radius:99px
}

.live:before{
  content:""
}

main{
  max-width:1240px;
  margin:auto;
  padding:30px 20px 60px;
  position:relative;
  z-index:1
}

.eyebrow{
  color:var(--gold);
  font-size:11px;
  letter-spacing:2.5px;
  font-weight:800
}

.home-grid{
  display:grid;
  grid-template-columns:1.25fr .9fr;
  gap:24px
}

.hero-copy{
  padding:38px 0
}

.hero-copy h1{
  font-size:clamp(44px,6vw,76px);
  line-height:.9;
  letter-spacing:-2px;
  margin:18px 0
}

.hero-copy h1 span{
  color:var(--gold)
}

.hero-copy>p{
  max-width:560px;
  color:var(--muted);
  font-size:17px;
  line-height:1.6
}

.hero-stats{
  display:flex;
  gap:36px;
  margin:30px 0
}

.hero-stats div{
  display:flex;
  flex-direction:column
}

.hero-stats b{
  font-size:24px;
  color:var(--gold)
}

.hero-stats span{
  font-size:12px;
  color:var(--muted)
}

.quick-links{
  display:flex;
  gap:16px;
  align-items:center
}

.quick-links button{
  border:0;
  background:var(--gold);
  color:#111;
  padding:13px 18px;
  border-radius:10px;
  font-weight:800
}

.quick-links a{
  color:#fff;
  font-size:14px
}

.login-card{
  background:linear-gradient(160deg,#171717,#0c0c0c);
  border:1px solid var(--line);
  border-radius:20px;
  padding:24px;
  box-shadow:0 24px 60px #0008
}

.login-head{
  display:flex;
  gap:12px;
  align-items:center
}

.login-head img{
  width:58px;
  height:58px;
  -o-object-fit:contain;
     object-fit:contain
}

.login-head span{
  color:var(--gold);
  font-size:10px;
  letter-spacing:2px
}

.login-head h2{
  margin:3px 0;
  font-size:26px
}

.role-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#090909;
  border:1px solid var(--line);
  padding:4px;
  border-radius:10px;
  margin:20px 0
}

.role-switch button{
  border:0;
  background:transparent;
  color:#aaa;
  padding:10px;
  border-radius:7px;
  font-weight:800
}

.role-switch button.active{
  background:var(--gold);
  color:#111
}

label{
  display:flex;
  flex-direction:column;
  gap:7px;
  font-size:13px;
  color:#ddd;
  margin:12px 0
}

input,select{
  width:100%;
  background:#090909;
  border:1px solid #35301f;
  color:#fff;
  border-radius:9px;
  padding:12px 13px;
  outline:none
}

input:focus,select:focus{
  border-color:var(--gold)
}

.gold,.ghost,.outline,.wa{
  border:0;
  border-radius:9px;
  padding:13px 16px;
  font-weight:800
}

.gold{
  background:linear-gradient(180deg,var(--gold2),#a98316);
  color:#111
}

.ghost{
  background:#29241a;
  color:#fff;
  border:1px solid #554e2e
}

.outline{
  background:transparent;
  border:1px solid #4d472e;
  color:#fff
}

.demo-box{
  background:#211d0d;
  border:1px solid #5b4c18;
  padding:11px;
  border-radius:9px;
  display:flex;
  flex-direction:column;
  margin:13px 0;
  font-size:13px
}

.demo-box b{
  color:var(--gold2)
}

.error{
  color:#ff8f8f;
  background:#3b1717;
  padding:10px;
  border-radius:8px
}

.local-note{
  font-size:11px;
  color:#888;
  text-align:center
}

.public-strip{
  grid-column:1/-1;
  background:linear-gradient(90deg,#d4af37,#f4d35e);
  color:#111;
  border-radius:16px;
  padding:20px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.public-strip h3{
  margin:4px 0;
  font-size:30px
}

.public-strip p{
  margin:0
}

.public-strip button{
  border:0;
  background:#111;
  color:#fff;
  padding:13px 18px;
  border-radius:9px;
  font-weight:800
}

.back{
  border:0;
  background:transparent;
  color:var(--gold);
  padding:0 0 15px;
  font-weight:800
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px
}

.section-head h2{
  font-size:42px;
  margin:8px 0
}

.section-head p{
  color:var(--muted);
  max-width:420px
}

.plan-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin:24px 0
}

.plan,.plan-edit{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px
}

.plan.popular{
  border-color:var(--gold);
  position:relative
}

.popular-tag{
  position:absolute;
  top:-11px;
  left:20px;
  background:var(--gold);
  color:#111;
  padding:4px 8px;
  border-radius:99px;
  font-size:10px;
  font-weight:900
}

.plan h3{
  font-size:20px;
  margin:6px 0
}

.price{
  font-size:28px;
  color:var(--gold);
  font-weight:900
}

.plan p{
  color:var(--muted);
  min-height:44px
}

.plan span{
  font-size:12px;
  color:#aaa
}

.plan button{
  width:100%;
  margin-top:16px;
  background:#29241a;
  color:#fff;
  border:1px solid #554e2e;
  border-radius:9px;
  padding:11px
}

.hours{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}

.hours>div{
  background:var(--surface);
  border:1px solid var(--line);
  padding:20px;
  border-radius:16px;
  display:flex;
  gap:14px
}

.hours svg{
  color:var(--gold)
}

.role-note,.login-note{
  color:#d8ffe9;
  background:#143d27;
  border:1px solid #2b6a49;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  margin:10px 0
}

.app-layout{
  display:grid;
  grid-template-columns:250px 1fr;
  max-width:1360px;
  margin:auto;
  min-height:calc(100vh - 73px)
}

.side{
  border-right:1px solid var(--line);
  padding:20px 16px;
  background:#080808
}

.side-brand{
  display:flex;
  gap:10px;
